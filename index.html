<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MOODS by Roxy — App (preview)</title>
<meta name="theme-color" content="#F3EEE5">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="logo/moods-icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MOODS">
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="preview-note">Preview · notificările sunt simulate, nimic nu e trimis nicăieri</div>
<div class="app">
  <!-- Notificare demonstrativă (simulează un push) -->
  <div class="push" id="push" role="status" aria-live="polite" hidden>
    <img src="icon-192.png" alt="" width="36" height="36">
    <div><b>MOODS by Roxy</b><span id="push-text"></span></div>
    <small>now</small>
  </div>

  <header class="topbar">
    <img class="logo" src="logo/moods-logo-brown-transparent.svg" alt="MOODS by Roxy Salon" width="815" height="325">
    <button class="bell" id="bell" aria-label="Notifications">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/></svg>
      <i class="dot" id="bell-dot"></i>
    </button>
  </header>

  <main id="view" tabindex="-1"></main>

  <nav class="tabbar" aria-label="Main">
    <a href="#home" data-tab="home"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z"/></svg><span>Home</span></a>
    <a href="#services" data-tab="services"><svg viewBox="0 0 24 24"><path d="M12 3c2 3 5 4.5 5 8.5a5 5 0 0 1-10 0C7 7.5 10 6 12 3z"/><path d="M5 21h14"/></svg><span>Services</span></a>
    <a href="#offers" data-tab="offers"><svg viewBox="0 0 24 24"><path d="M20 12v9H4v-9M2 7h20v5H2zM12 21V7M12 7S10.5 3 8 3a2 2 0 0 0 0 4h4zm0 0s1.5-4 4-4a2 2 0 0 1 0 4h-4z"/></svg><span>Offers</span></a>
    <a href="#contact" data-tab="contact"><svg viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg><span>Contact</span></a>
  </nav>
</div>


<script src="app.js"></script>
</body>
</html>
